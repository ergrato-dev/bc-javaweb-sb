<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">

  <rect width="800" height="460" fill="#0d1117"/>

  <text x="400" y="32" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="middle">Entidad JPA — Mapeo a Tabla SQL</text>

  <text x="195" y="60" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#6DB33F" text-anchor="middle">Clase Java @Entity</text>
  <text x="605" y="60" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#388bfd" text-anchor="middle">Tabla SQL products</text>

  <rect x="20" y="70" width="350" height="348" rx="8" fill="#161b22" stroke="#6DB33F" stroke-width="1.5"/>
  <rect x="435" y="70" width="345" height="348" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>

  <text x="35" y="94" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">@Entity</text>
  <text x="35" y="110" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">@Table</text>
  <text x="90" y="110" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">(name = </text>
  <text x="137" y="110" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a8ff78">"products"</text>
  <text x="205" y="110" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">)</text>
  <text x="35" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#ff7b72">public class </text>
  <text x="115" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">Product </text>
  <text x="160" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">{</text>

  <rect x="30" y="133" width="330" height="36" rx="4" fill="#1a2a1a" stroke="#6DB33F" stroke-width="1"/>
  <text x="42" y="148" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">  @Id  @GeneratedValue</text>
  <text x="190" y="148" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">(IDENTITY)</text>
  <text x="42" y="162" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#ff7b72">  private </text>
  <text x="92" y="162" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a5d6ff">Long </text>
  <text x="120" y="162" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">id;</text>

  <rect x="30" y="175" width="330" height="36" rx="4" fill="#1a1a2a" stroke="#388bfd" stroke-width="1"/>
  <text x="42" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">  @Column</text>
  <text x="95" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">(nullable = false)</text>
  <text x="42" y="206" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#ff7b72">  private </text>
  <text x="92" y="206" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a5d6ff">String </text>
  <text x="130" y="206" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">name;</text>

  <rect x="30" y="217" width="330" height="36" rx="4" fill="#1a1a2a" stroke="#388bfd" stroke-width="1"/>
  <text x="42" y="232" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">  @Column</text>
  <text x="95" y="232" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">(precision=10, scale=2)</text>
  <text x="42" y="248" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#ff7b72">  private </text>
  <text x="92" y="248" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a5d6ff">BigDecimal </text>
  <text x="158" y="248" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">price;</text>

  <rect x="30" y="259" width="330" height="36" rx="4" fill="#1a1a2a" stroke="#388bfd" stroke-width="1"/>
  <text x="42" y="274" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">  @Column</text>
  <text x="95" y="274" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">(nullable = false)</text>
  <text x="42" y="290" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#ff7b72">  private </text>
  <text x="92" y="290" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a5d6ff">Integer </text>
  <text x="140" y="290" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">stock;</text>

  <rect x="30" y="301" width="330" height="36" rx="4" fill="#1a1a2a" stroke="#388bfd" stroke-width="1"/>
  <text x="42" y="316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">  @Column</text>
  <text x="95" y="316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">(nullable = false)</text>
  <text x="42" y="332" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#ff7b72">  private </text>
  <text x="92" y="332" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a5d6ff">String </text>
  <text x="130" y="332" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">category;</text>

  <text x="42" y="360" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8b949e">  protected Product() {} // JPA requiere</text>
  <text x="42" y="378" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8b949e">  // constructor + getters...</text>
  <text x="35" y="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">}</text>

  <rect x="450" y="82" width="315" height="30" rx="4" fill="#1a2744" stroke="#388bfd" stroke-width="1"/>
  <text x="458" y="98" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8b949e">-- DDL generado por Hibernate</text>
  <text x="458" y="112" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#ff7b72">CREATE TABLE </text>
  <text x="546" y="112" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">products </text>
  <text x="600" y="112" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">(</text>

  <rect x="450" y="120" width="315" height="26" rx="4" fill="#1a2a1a"/>
  <text x="462" y="137" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a5d6ff">id </text>
  <text x="478" y="137" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">BIGINT GENERATED BY DEFAULT PRIMARY KEY,</text>

  <rect x="450" y="152" width="315" height="26" rx="4" fill="#1a1a2a"/>
  <text x="462" y="169" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a5d6ff">name </text>
  <text x="493" y="169" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">VARCHAR(255) NOT NULL,</text>

  <rect x="450" y="184" width="315" height="26" rx="4" fill="#1a1a2a"/>
  <text x="462" y="201" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a5d6ff">price </text>
  <text x="498" y="201" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">DECIMAL(10,2) NOT NULL,</text>

  <rect x="450" y="216" width="315" height="26" rx="4" fill="#1a1a2a"/>
  <text x="462" y="233" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a5d6ff">stock </text>
  <text x="500" y="233" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">INTEGER NOT NULL,</text>

  <rect x="450" y="248" width="315" height="26" rx="4" fill="#1a1a2a"/>
  <text x="462" y="265" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a5d6ff">category </text>
  <text x="516" y="265" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">VARCHAR(255) NOT NULL</text>

  <text x="450" y="292" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">);</text>

  <rect x="450" y="312" width="315" height="90" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="462" y="330" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8b949e">-- Consulta generada por JpaRepository</text>
  <text x="462" y="347" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#ff7b72">SELECT </text>
  <text x="504" y="347" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">* FROM products</text>
  <text x="462" y="363" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#ff7b72">WHERE </text>
  <text x="503" y="363" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a5d6ff">category </text>
  <text x="551" y="363" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">= ?</text>
  <text x="462" y="380" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8b949e">-- generado desde: findByCategory()</text>
  <text x="462" y="396" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8b949e">-- sin escribir SQL manualmente</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e3b341"/>
    </marker>
  </defs>
  <line x1="375" y1="170" x2="428" y2="170" stroke="#e3b341" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="4,3"/>
  <line x1="375" y1="235" x2="428" y2="200" stroke="#e3b341" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="4,3"/>
  <line x1="375" y1="275" x2="428" y2="234" stroke="#e3b341" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="4,3"/>
  <line x1="375" y1="315" x2="428" y2="264" stroke="#e3b341" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="4,3"/>

  <text x="400" y="434" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Hibernate lee las anotaciones en tiempo de inicio y genera el DDL automaticamente (con ddl-auto=create-drop)</text>
  <text x="400" y="450" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">En produccion se usa ddl-auto=validate junto con Flyway para controlar migraciones manualmente</text>

</svg>
