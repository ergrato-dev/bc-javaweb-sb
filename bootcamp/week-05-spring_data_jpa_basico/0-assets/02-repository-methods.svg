<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">

  <rect width="800" height="460" fill="#0d1117"/>

  <text x="400" y="30" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="middle">JpaRepository — Metodos Disponibles</text>

  <rect x="20" y="45" width="240" height="258" rx="8" fill="#161b22" stroke="#6DB33F" stroke-width="1.5"/>
  <text x="140" y="67" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#6DB33F" text-anchor="middle">CRUD Gratuito</text>
  <text x="32" y="86" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#8b949e">Heredado de JpaRepository</text>

  <rect x="30" y="94" width="220" height="196" rx="4" fill="#0d1117"/>
  <text x="42" y="111" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">findAll</text>
  <text x="95" y="111" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">()  </text>
  <text x="130" y="111" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#8b949e">List&lt;T&gt;</text>

  <text x="42" y="129" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">findById</text>
  <text x="101" y="129" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">(ID)  </text>
  <text x="144" y="129" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#8b949e">Optional&lt;T&gt;</text>

  <text x="42" y="147" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">save</text>
  <text x="74" y="147" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">(T entity)  </text>
  <text x="167" y="147" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#8b949e">T</text>

  <text x="42" y="165" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">saveAll</text>
  <text x="92" y="165" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">(List)  </text>
  <text x="140" y="165" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#8b949e">List&lt;T&gt;</text>

  <text x="42" y="183" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">deleteById</text>
  <text x="110" y="183" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">(ID)</text>

  <text x="42" y="201" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">delete</text>
  <text x="86" y="201" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">(T entity)</text>

  <text x="42" y="219" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">existsById</text>
  <text x="110" y="219" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">(ID)  </text>
  <text x="148" y="219" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#8b949e">boolean</text>

  <text x="42" y="237" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">count</text>
  <text x="80" y="237" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">()  </text>
  <text x="106" y="237" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#8b949e">long</text>

  <text x="42" y="255" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">findAll</text>
  <text x="95" y="255" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">(Pageable)  </text>
  <text x="181" y="255" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#8b949e">Page&lt;T&gt;</text>

  <text x="42" y="279" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">findAll</text>
  <text x="95" y="279" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">(Sort)  </text>
  <text x="165" y="279" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#8b949e">List&lt;T&gt;</text>

  <rect x="275" y="45" width="240" height="258" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
  <text x="395" y="67" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#388bfd" text-anchor="middle">Derived Query Methods</text>
  <text x="287" y="86" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#8b949e">Spring genera SQL por el nombre</text>

  <rect x="285" y="94" width="220" height="196" rx="4" fill="#0d1117"/>
  <text x="297" y="113" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#e3b341">findBy</text>
  <text x="336" y="113" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#a5d6ff">Category</text>
  <text x="395" y="113" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#e6edf3">(String c)</text>
  <text x="297" y="127" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#8b949e">  WHERE category = ?</text>

  <text x="297" y="146" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#e3b341">findBy</text>
  <text x="336" y="146" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#a5d6ff">Price</text>
  <text x="371" y="146" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#e3b341">LessThan</text>
  <text x="433" y="146" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#e6edf3">(bd)</text>
  <text x="297" y="160" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#8b949e">  WHERE price &lt; ?</text>

  <text x="297" y="179" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#e3b341">existsBy</text>
  <text x="346" y="179" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#a5d6ff">Name</text>
  <text x="378" y="179" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#e6edf3">(String n)</text>
  <text x="297" y="193" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#8b949e">  SELECT EXISTS WHERE name=?</text>

  <text x="297" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#e3b341">countBy</text>
  <text x="345" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#a5d6ff">Category</text>
  <text x="404" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#e6edf3">(String c)</text>
  <text x="297" y="226" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#8b949e">  SELECT COUNT WHERE category=?</text>

  <text x="297" y="245" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#e3b341">findBy</text>
  <text x="336" y="245" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#a5d6ff">Category</text>
  <text x="395" y="245" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#e3b341">And</text>
  <text x="297" y="259" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#a5d6ff">Stock</text>
  <text x="335" y="259" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#e3b341">GreaterThan</text>
  <text x="297" y="273" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#8b949e">  WHERE category=? AND stock&gt;?</text>

  <text x="297" y="284" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#6b7280">Prefijos: findBy, countBy, existsBy, deleteBy</text>

  <rect x="530" y="45" width="250" height="258" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
  <text x="655" y="67" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#e3b341" text-anchor="middle">@Query JPQL Custom</text>
  <text x="542" y="86" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#8b949e">Para consultas complejas</text>

  <rect x="540" y="94" width="230" height="196" rx="4" fill="#0d1117"/>
  <text x="552" y="113" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#e3b341">@Query</text>
  <text x="597" y="113" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#e6edf3">(</text>
  <text x="552" y="127" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#a8ff78">"SELECT p FROM Product p</text>
  <text x="552" y="141" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#a8ff78"> WHERE LOWER(p.name)</text>
  <text x="552" y="155" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#a8ff78"> LIKE LOWER(:name)"</text>
  <text x="552" y="169" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#e6edf3">)</text>
  <text x="552" y="185" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#a5d6ff">List</text>
  <text x="572" y="185" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#e6edf3">&lt;</text>
  <text x="578" y="185" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#e3b341">Product</text>
  <text x="622" y="185" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#e6edf3">&gt; searchByName(</text>
  <text x="552" y="199" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#e3b341">  @Param</text>
  <text x="601" y="199" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#e6edf3">(</text>
  <text x="607" y="199" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#a8ff78">"name"</text>
  <text x="645" y="199" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#e6edf3">)</text>
  <text x="552" y="213" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#a5d6ff">  String </text>
  <text x="601" y="213" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#e6edf3">name);</text>

  <text x="552" y="240" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#6b7280">Usa: FROM Entidad (no tabla)</text>
  <text x="552" y="253" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#6b7280">Filtra por: campos Java (no columnas)</text>
  <text x="552" y="266" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#6b7280">nativeQuery=true → SQL directo</text>
  <text x="552" y="280" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#6b7280">@Modifying → UPDATE / DELETE</text>

  <rect x="20" y="320" width="760" height="120" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="400" y="342" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#e6edf3" text-anchor="middle">Cuando usar cada uno</text>

  <rect x="32" y="352" width="230" height="74" rx="5" fill="#1a2a1a"/>
  <text x="147" y="370" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600" fill="#6DB33F" text-anchor="middle">CRUD heredado</text>
  <text x="42" y="386" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#8b949e">Operaciones basicas: guardar,</text>
  <text x="42" y="400" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#8b949e">buscar por ID, eliminar, contar.</text>
  <text x="42" y="416" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#8b949e">Sin configuracion adicional.</text>

  <rect x="285" y="352" width="230" height="74" rx="5" fill="#1a1a2a"/>
  <text x="400" y="370" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600" fill="#388bfd" text-anchor="middle">Derived Query Methods</text>
  <text x="295" y="386" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#8b949e">Filtros simples: por 1-3 campos.</text>
  <text x="295" y="400" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#8b949e">Spring genera el SQL — legibles,</text>
  <text x="295" y="416" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#8b949e">pero evitar nombres muy largos.</text>

  <rect x="538" y="352" width="230" height="74" rx="5" fill="#2d2000"/>
  <text x="653" y="370" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600" fill="#e3b341" text-anchor="middle">@Query JPQL</text>
  <text x="548" y="386" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#8b949e">Consultas complejas: LIKE, BETWEEN,</text>
  <text x="548" y="400" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#8b949e">JOIN, GROUP BY, UPDATE/DELETE.</text>
  <text x="548" y="416" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#8b949e">Full control sobre la query JPQL.</text>

</svg>
