<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">

  <!-- Background -->
  <rect width="800" height="320" fill="#0d1117"/>

  <!-- Title -->
  <text x="24" y="28" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#6DB33F" letter-spacing="1.5">STREAM PIPELINE — LAZY vs EAGER</text>

  <!-- ── Pipeline boxes ─────────────────────────────────────── -->

  <!-- Box 1: Source -->
  <rect x="24" y="40" width="130" height="80" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="2"/>
  <text x="89" y="64" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#388bfd" text-anchor="middle">FUENTE</text>
  <text x="89" y="84" font-family="ui-monospace,monospace" font-size="12" fill="#e6edf3" text-anchor="middle">List.of(</text>
  <text x="89" y="100" font-family="ui-monospace,monospace" font-size="12" fill="#e6edf3" text-anchor="middle">1, 2, …, 10)</text>
  <text x="89" y="138" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#388bfd" text-anchor="middle">.stream()</text>

  <!-- Arrow 1 -->
  <line x1="154" y1="80" x2="182" y2="80" stroke="#30363d" stroke-width="2"/>
  <polygon points="182,75 192,80 182,85" fill="#30363d"/>

  <!-- Box 2: filter -->
  <rect x="192" y="40" width="130" height="80" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="257" y="64" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="700" fill="#e3b341" text-anchor="middle">INTERMEDIA</text>
  <text x="257" y="84" font-family="ui-monospace,monospace" font-size="14" fill="#e6edf3" text-anchor="middle">.filter()</text>
  <text x="257" y="102" font-family="ui-monospace,monospace" font-size="11" fill="#6e7681" text-anchor="middle">n % 2 == 0</text>
  <!-- lazy badge -->
  <rect x="218" y="128" width="78" height="18" rx="9" fill="#2d2000" stroke="#e3b341" stroke-width="1"/>
  <text x="257" y="141" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="700" fill="#e3b341" text-anchor="middle">⚡ lazy</text>

  <!-- Arrow 2 -->
  <line x1="322" y1="80" x2="350" y2="80" stroke="#30363d" stroke-width="2"/>
  <polygon points="350,75 360,80 350,85" fill="#30363d"/>

  <!-- Box 3: map -->
  <rect x="360" y="40" width="130" height="80" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="425" y="64" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="700" fill="#e3b341" text-anchor="middle">INTERMEDIA</text>
  <text x="425" y="84" font-family="ui-monospace,monospace" font-size="14" fill="#e6edf3" text-anchor="middle">.map()</text>
  <text x="425" y="102" font-family="ui-monospace,monospace" font-size="11" fill="#6e7681" text-anchor="middle">n → n * n</text>
  <!-- lazy badge -->
  <rect x="386" y="128" width="78" height="18" rx="9" fill="#2d2000" stroke="#e3b341" stroke-width="1"/>
  <text x="425" y="141" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="700" fill="#e3b341" text-anchor="middle">⚡ lazy</text>

  <!-- Ellipsis (more ops possible) -->
  <text x="510" y="86" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#30363d" text-anchor="middle">···</text>
  <line x1="490" y1="80" x2="528" y2="80" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Arrow 3 -->
  <line x1="528" y1="80" x2="550" y2="80" stroke="#30363d" stroke-width="2"/>
  <polygon points="550,75 560,80 550,85" fill="#30363d"/>

  <!-- Box 4: terminal (toList) -->
  <rect x="560" y="40" width="216" height="80" rx="8" fill="#0f2d17" stroke="#6DB33F" stroke-width="2"/>
  <text x="668" y="64" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="700" fill="#7ee787" text-anchor="middle">TERMINAL</text>
  <text x="668" y="84" font-family="ui-monospace,monospace" font-size="14" fill="#e6edf3" text-anchor="middle">.toList()</text>
  <text x="668" y="102" font-family="ui-monospace,monospace" font-size="11" fill="#6e7681" text-anchor="middle">o .collect(...)</text>
  <!-- eager badge -->
  <rect x="614" y="128" width="108" height="18" rx="9" fill="#0f2d17" stroke="#6DB33F" stroke-width="1"/>
  <text x="668" y="141" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="700" fill="#7ee787" text-anchor="middle">▶ eager — ejecuta todo</text>

  <!-- ── Brace indicating lazy ops ─────────────────────────── -->
  <!-- Horizontal brace under boxes 2 and 3 -->
  <line x1="192" y1="160" x2="490" y2="160" stroke="#e3b341" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="192" y1="155" x2="192" y2="160" stroke="#e3b341" stroke-width="1"/>
  <line x1="490" y1="155" x2="490" y2="160" stroke="#e3b341" stroke-width="1"/>
  <text x="341" y="176" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#e3b341" text-anchor="middle">no ejecutan hasta que llega la operación terminal ↓</text>

  <!-- ── Execution note ─────────────────────────────────────── -->
  <rect x="24" y="194" width="752" height="50" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="400" y="214" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Las operaciones intermedias son <tspan font-weight="700" fill="#e3b341">LAZY</tspan> — describen QUÉ hacer, no hacen nada todavía.</text>
  <text x="400" y="234" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Cuando llega la operación <tspan font-weight="700" fill="#6DB33F">TERMINAL</tspan>, Java ejecuta el pipeline de principio a fin, elemento por elemento.</text>

  <!-- ── Key operations reference ──────────────────────────── -->
  <text x="24" y="270" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#6DB33F" letter-spacing="1.5">OPERACIONES COMUNES</text>

  <!-- Intermedias -->
  <text x="24" y="288" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#e3b341" font-weight="600">Intermedias (lazy): </text>
  <text x="164" y="288" font-family="ui-monospace,monospace" font-size="11" fill="#8b949e">filter  map  flatMap  sorted  distinct  limit  skip  peek</text>

  <!-- Terminales -->
  <text x="24" y="308" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#6DB33F" font-weight="600">Terminales (eager): </text>
  <text x="164" y="308" font-family="ui-monospace,monospace" font-size="11" fill="#8b949e">toList  collect  forEach  count  reduce  findFirst  anyMatch</text>

</svg>
