<svg xmlns="http://www.w3.org/2000/svg" width="860" height="490" viewBox="0 0 860 490">
  <rect width="860" height="490" fill="#0d1117"/>

  <!-- Title -->
  <text x="430" y="36" font-family="Inter,Roboto,sans-serif" font-size="17" font-weight="bold"
        fill="#ffffff" text-anchor="middle">@Transactional — Ciclo de Vida y Propagación</text>

  <!-- == SECTION 1: Happy path == -->
  <text x="50" y="68" font-family="Inter,Roboto,sans-serif" font-size="12" font-weight="bold" fill="#6DB33F">Flujo normal (commit)</text>

  <!-- Begin TX -->
  <rect x="30" y="78" width="120" height="36" rx="5" fill="#161b22" stroke="#6DB33F" stroke-width="2"/>
  <text x="90" y="101" font-family="Inter,Roboto,sans-serif" font-size="11" fill="#6DB33F" text-anchor="middle">BEGIN TX</text>

  <!-- Arrow -->
  <line x1="150" y1="96" x2="185" y2="96" stroke="#6DB33F" stroke-width="2" marker-end="url(#arrowG)"/>

  <!-- Op 1 -->
  <rect x="185" y="78" width="120" height="36" rx="5" fill="#161b22" stroke="#8b949e" stroke-width="1"/>
  <text x="245" y="97" font-family="Inter,Roboto,sans-serif" font-size="10" fill="#e6edf3" text-anchor="middle">repo.save(entity)</text>
  <text x="245" y="108" font-family="Inter,Roboto,sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">SQL: INSERT</text>

  <!-- Arrow -->
  <line x1="305" y1="96" x2="340" y2="96" stroke="#6DB33F" stroke-width="2" marker-end="url(#arrowG)"/>

  <!-- Op 2 -->
  <rect x="340" y="78" width="120" height="36" rx="5" fill="#161b22" stroke="#8b949e" stroke-width="1"/>
  <text x="400" y="97" font-family="Inter,Roboto,sans-serif" font-size="10" fill="#e6edf3" text-anchor="middle">repo.save(related)</text>
  <text x="400" y="108" font-family="Inter,Roboto,sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">SQL: INSERT</text>

  <!-- Arrow -->
  <line x1="460" y1="96" x2="495" y2="96" stroke="#6DB33F" stroke-width="2" marker-end="url(#arrowG)"/>

  <!-- Método retorna -->
  <rect x="495" y="78" width="120" height="36" rx="5" fill="#161b22" stroke="#8b949e" stroke-width="1"/>
  <text x="555" y="97" font-family="Inter,Roboto,sans-serif" font-size="10" fill="#e6edf3" text-anchor="middle">método retorna</text>
  <text x="555" y="108" font-family="Inter,Roboto,sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">no exception</text>

  <!-- Arrow -->
  <line x1="615" y1="96" x2="650" y2="96" stroke="#6DB33F" stroke-width="2" marker-end="url(#arrowG)"/>

  <!-- COMMIT -->
  <rect x="650" y="78" width="120" height="36" rx="5" fill="#238636" stroke="#3fb950" stroke-width="2"/>
  <text x="710" y="101" font-family="Inter,Roboto,sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">COMMIT ✓</text>

  <!-- == SECTION 2: Rollback path == -->
  <text x="50" y="155" font-family="Inter,Roboto,sans-serif" font-size="12" font-weight="bold" fill="#f85149">Flujo con error (rollback)</text>

  <!-- Begin TX -->
  <rect x="30" y="165" width="120" height="36" rx="5" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="90" y="188" font-family="Inter,Roboto,sans-serif" font-size="11" fill="#f85149" text-anchor="middle">BEGIN TX</text>

  <!-- Arrow -->
  <line x1="150" y1="183" x2="185" y2="183" stroke="#f85149" stroke-width="2" marker-end="url(#arrowR)"/>

  <!-- Op 1 -->
  <rect x="185" y="165" width="120" height="36" rx="5" fill="#161b22" stroke="#8b949e" stroke-width="1"/>
  <text x="245" y="184" font-family="Inter,Roboto,sans-serif" font-size="10" fill="#e6edf3" text-anchor="middle">repo.save(entity)</text>
  <text x="245" y="195" font-family="Inter,Roboto,sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">SQL: INSERT (pending)</text>

  <!-- Arrow -->
  <line x1="305" y1="183" x2="340" y2="183" stroke="#f85149" stroke-width="2" marker-end="url(#arrowR)"/>

  <!-- Exception -->
  <rect x="340" y="165" width="140" height="36" rx="5" fill="#3d1e1e" stroke="#f85149" stroke-width="2"/>
  <text x="410" y="184" font-family="Inter,Roboto,sans-serif" font-size="10" fill="#f85149" text-anchor="middle">RuntimeException !</text>
  <text x="410" y="195" font-family="Inter,Roboto,sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">propagates up...</text>

  <!-- Arrow to ROLLBACK -->
  <line x1="480" y1="183" x2="515" y2="183" stroke="#f85149" stroke-width="2" marker-end="url(#arrowR)"/>

  <!-- ROLLBACK -->
  <rect x="515" y="165" width="140" height="36" rx="5" fill="#3d1e1e" stroke="#f85149" stroke-width="2"/>
  <text x="585" y="184" font-family="Inter,Roboto,sans-serif" font-size="11" font-weight="bold" fill="#f85149" text-anchor="middle">ROLLBACK ✗</text>
  <text x="585" y="196" font-family="Inter,Roboto,sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">ningún cambio persiste</text>

  <!-- == SECTION 3: readOnly == -->
  <rect x="30" y="225" width="380" height="60" rx="5" fill="#161b22" stroke="#f0883e" stroke-width="1"/>
  <text x="44" y="245" font-family="Inter,Roboto,sans-serif" font-size="11" font-weight="bold" fill="#f0883e">@Transactional(readOnly = true)</text>
  <text x="44" y="263" font-family="Inter,Roboto,sans-serif" font-size="10" fill="#8b949e">Optimiza queries de lectura: deshabilita dirty checking</text>
  <text x="44" y="278" font-family="Inter,Roboto,sans-serif" font-size="10" fill="#8b949e">Se puede sobreescribir en métodos de escritura con @Transactional</text>

  <!-- == SECTION 4: Propagation == -->
  <text x="430" y="252" font-family="Inter,Roboto,sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Propagación</text>

  <!-- REQUIRED -->
  <rect x="430" y="260" width="195" height="50" rx="5" fill="#161b22" stroke="#6DB33F" stroke-width="1"/>
  <text x="444" y="278" font-family="Inter,Roboto,sans-serif" font-size="11" font-weight="bold" fill="#6DB33F">REQUIRED (default)</text>
  <text x="444" y="294" font-family="Inter,Roboto,sans-serif" font-size="10" fill="#8b949e">Usa TX existente o crea una nueva</text>
  <text x="444" y="305" font-family="Inter,Roboto,sans-serif" font-size="10" fill="#8b949e">Más común — métodos de servicio</text>

  <!-- REQUIRES_NEW -->
  <rect x="640" y="260" width="195" height="50" rx="5" fill="#161b22" stroke="#f0883e" stroke-width="1"/>
  <text x="654" y="278" font-family="Inter,Roboto,sans-serif" font-size="11" font-weight="bold" fill="#f0883e">REQUIRES_NEW</text>
  <text x="654" y="294" font-family="Inter,Roboto,sans-serif" font-size="10" fill="#8b949e">Siempre TX independiente</text>
  <text x="654" y="305" font-family="Inter,Roboto,sans-serif" font-size="10" fill="#8b949e">Útil para logs / auditoría</text>

  <!-- == SECTION 5: @Version optimistic lock == -->
  <text x="50" y="320" font-family="Inter,Roboto,sans-serif" font-size="12" font-weight="bold" fill="#a5d6ff">Bloqueo Optimista — @Version</text>

  <rect x="30" y="330" width="380" height="130" rx="5" fill="#161b22" stroke="#a5d6ff" stroke-width="1"/>
  <text x="44" y="350" font-family="Inter,Roboto,mono,monospace" font-size="11" fill="#a5d6ff">@Version private Long version;</text>
  <text x="44" y="370" font-family="Inter,Roboto,sans-serif" font-size="10" fill="#8b949e">Usuario A lee: post{version=0} ← ──────────┐</text>
  <text x="44" y="388" font-family="Inter,Roboto,sans-serif" font-size="10" fill="#8b949e">Usuario B lee: post{version=0} ← ──────────┘</text>
  <text x="44" y="406" font-family="Inter,Roboto,sans-serif" font-size="10" fill="#6DB33F">Usuario A guarda → version=0 coincide → OK, version=1</text>
  <text x="44" y="424" font-family="Inter,Roboto,sans-serif" font-size="10" fill="#f85149">Usuario B guarda → version=0 ya no coincide → OptimisticLockException</text>
  <text x="44" y="448" font-family="Inter,Roboto,sans-serif" font-size="10" fill="#f0883e">SQL: UPDATE post SET ... WHERE id=? AND version=0</text>

  <!-- == SECTION 6: LazyInitializationException note == -->
  <rect x="430" y="330" width="400" height="130" rx="5" fill="#161b22" stroke="#f85149" stroke-width="1"/>
  <text x="444" y="350" font-family="Inter,Roboto,sans-serif" font-size="11" font-weight="bold" fill="#f85149">LazyInitializationException</text>
  <text x="444" y="368" font-family="Inter,Roboto,sans-serif" font-size="10" fill="#f85149">❌ Acceso a lazy collection fuera de TX:</text>
  <text x="444" y="384" font-family="Inter,Roboto,mono,monospace" font-size="10" fill="#8b949e">post.getComments().size() // ERROR</text>
  <text x="444" y="404" font-family="Inter,Roboto,sans-serif" font-size="10" fill="#6DB33F">✅ Solución 1 — JOIN FETCH en la query:</text>
  <text x="444" y="420" font-family="Inter,Roboto,mono,monospace" font-size="10" fill="#8b949e">LEFT JOIN FETCH p.comments WHERE p.id=:id</text>
  <text x="444" y="440" font-family="Inter,Roboto,sans-serif" font-size="10" fill="#6DB33F">✅ Solución 2 — Permanecer en @Transactional</text>
  <text x="444" y="456" font-family="Inter,Roboto,sans-serif" font-size="10" fill="#8b949e">El service debe ser @Transactional(readOnly=true)</text>

  <defs>
    <marker id="arrowG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6DB33F"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f85149"/>
    </marker>
  </defs>
</svg>