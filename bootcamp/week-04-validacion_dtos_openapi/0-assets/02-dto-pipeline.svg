<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <rect width="800" height="460" fill="#0d1117"/>
  <text x="400" y="32" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">DTO Pipeline: Request → Dominio → Response</text>
  <text x="400" y="62" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">El cliente nunca ve el modelo interno — los DTOs actuan como contrato publico de la API</text>
  <rect x="20" y="80" width="140" height="60" rx="8" fill="#1a2744" stroke="#388bfd" stroke-width="2"/>
  <text x="90" y="105" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#a5d6ff" text-anchor="middle">HTTP Client</text>
  <text x="90" y="122" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#6b7280" text-anchor="middle">JSON { name, email }</text>
  <line x1="160" y1="110" x2="195" y2="110" stroke="#388bfd" stroke-width="2"/>
  <polygon points="195,106 205,110 195,114" fill="#388bfd"/>
  <rect x="205" y="80" width="150" height="60" rx="8" fill="#1a3a1a" stroke="#6DB33F" stroke-width="2"/>
  <text x="280" y="101" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#7ee787" text-anchor="middle">@RestController</text>
  <text x="280" y="117" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341" text-anchor="middle">@Valid @RequestBody</text>
  <text x="280" y="133" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#6b7280" text-anchor="middle">EmployeeRequest</text>
  <line x1="355" y1="110" x2="390" y2="110" stroke="#6DB33F" stroke-width="2"/>
  <polygon points="390,106 400,110 390,114" fill="#6DB33F"/>
  <rect x="400" y="80" width="150" height="60" rx="8" fill="#2a1a2a" stroke="#bc8cff" stroke-width="2"/>
  <text x="475" y="101" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#bc8cff" text-anchor="middle">@Service</text>
  <text x="475" y="117" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#6b7280" text-anchor="middle">logica de negocio</text>
  <text x="475" y="133" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#6b7280" text-anchor="middle">mapea → dominio → response</text>
  <line x1="550" y1="110" x2="585" y2="110" stroke="#bc8cff" stroke-width="2"/>
  <polygon points="585,106 595,110 585,114" fill="#bc8cff"/>
  <rect x="595" y="80" width="150" height="60" rx="8" fill="#1a2700" stroke="#e3b341" stroke-width="2"/>
  <text x="670" y="101" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#e3b341" text-anchor="middle">@Repository</text>
  <text x="670" y="117" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#6b7280" text-anchor="middle">almacenamiento</text>
  <text x="670" y="133" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#6b7280" text-anchor="middle">(semana 05 — JPA)</text>
  <line x1="475" y1="140" x2="475" y2="165" stroke="#bc8cff" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="471,165 475,173 479,165" fill="#bc8cff"/>
  <text x="485" y="158" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#bc8cff">retorna EmployeeResponse</text>
  <line x1="355" y1="173" x2="155" y2="173" stroke="#388bfd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="155,169 145,173 155,177" fill="#388bfd"/>
  <text x="230" y="168" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#388bfd">200 OK + JSON response</text>
  <text x="30" y="210" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#6DB33F">Por que usar DTOs — separacion de capas</text>
  <rect x="30" y="222" width="230" height="210" rx="8" fill="#0d1f0d" stroke="#6DB33F" stroke-width="1.5"/>
  <text x="145" y="244" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#7ee787" text-anchor="middle">✅ Con DTOs</text>
  <text x="45" y="266" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#e6edf3">- API independiente del modelo JPA</text>
  <text x="45" y="284" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#e6edf3">- Campos sensibles excluidos</text>
  <text x="45" y="302" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#e6edf3">  (ej. password, salary interno)</text>
  <text x="45" y="320" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#e6edf3">- Formato de respuesta estable</text>
  <text x="45" y="338" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#e6edf3">- Validacion en el borde de entrada</text>
  <text x="45" y="356" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#e6edf3">- Cambios internos sin romper API</text>
  <text x="45" y="374" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#e6edf3">- Records Java: inmutables por defecto</text>
  <text x="45" y="392" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#e6edf3">- Documentacion clara con @Schema</text>
  <text x="45" y="418" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#7ee787">public record EmployeeResponse(</text>
  <text x="45" y="432" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#7ee787">  Long id, String name, String email)</text>
  <rect x="278" y="222" width="230" height="210" rx="8" fill="#1f0000" stroke="#ff7b72" stroke-width="1.5"/>
  <text x="393" y="244" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#ff7b72" text-anchor="middle">❌ Sin DTOs (exposicion directa)</text>
  <text x="293" y="266" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#e6edf3">- Entidad JPA expuesta al cliente</text>
  <text x="293" y="284" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#e6edf3">- Campos @Column(nullable=false)</text>
  <text x="293" y="302" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#e6edf3">  visibles en el JSON</text>
  <text x="293" y="320" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#e6edf3">- Cambio interno rompe el contrato</text>
  <text x="293" y="338" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#e6edf3">- Puede exponer datos sensibles</text>
  <text x="293" y="356" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#e6edf3">- Problemas con lazy loading JPA</text>
  <text x="293" y="374" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#e6edf3">- Ciclos de serializacion JSON</text>
  <text x="293" y="398" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#ff7b72">@GetMapping</text>
  <text x="293" y="414" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#ff7b72">Employee getById(Long id)</text>
  <text x="293" y="430" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#8b949e">// nunca exponer @Entity</text>
  <rect x="526" y="222" width="254" height="210" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="653" y="244" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#e3b341" text-anchor="middle">Mapeo con MapStruct</text>
  <rect x="538" y="252" width="230" height="166" rx="5" fill="#0d1117"/>
  <text x="550" y="270" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">@Mapper</text>
  <text x="608" y="270" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">(componentModel = </text>
  <text x="550" y="286" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a8ff78">              "spring"</text>
  <text x="672" y="286" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">)</text>
  <text x="550" y="302" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#ff7b72">public interface </text>
  <text x="662" y="302" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">EmployeeMapper</text>
  <text x="550" y="318" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">{</text>
  <text x="550" y="338" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a5d6ff">  EmployeeResponse</text>
  <text x="550" y="354" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">  toResponse(</text>
  <text x="618" y="354" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">Employee </text>
  <text x="670" y="354" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">e);</text>
  <text x="550" y="376" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a5d6ff">  List&lt;EmployeeResponse&gt;</text>
  <text x="550" y="392" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">  toResponseList(</text>
  <text x="550" y="408" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">    List&lt;Employee&gt; </text>
  <text x="672" y="408" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">l);</text>
  <text x="550" y="424" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">}</text>
</svg>
