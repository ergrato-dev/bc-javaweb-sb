<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <rect width="800" height="460" fill="#0d1117"/>
  <text x="400" y="32" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">SpringDoc OpenAPI — Como funciona Swagger UI</text>

  <text x="30" y="62" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#6DB33F">Flujo de Generacion Automatica</text>

  <rect x="20" y="74" width="140" height="62" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="90" y="96" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#e6edf3" text-anchor="middle">@RestController</text>
  <text x="90" y="112" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341" text-anchor="middle">@Operation</text>
  <text x="90" y="126" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">anotaciones en el codigo</text>

  <line x1="160" y1="105" x2="190" y2="105" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="190,101 200,105 190,109" fill="#30363d"/>

  <rect x="200" y="74" width="140" height="62" rx="8" fill="#2d2000" stroke="#e3b341" stroke-width="1.5"/>
  <text x="270" y="96" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#e3b341" text-anchor="middle">SpringDoc</text>
  <text x="270" y="112" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">escanea en startup</text>
  <text x="270" y="126" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">reflection + anotaciones</text>

  <line x1="340" y1="105" x2="370" y2="105" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="370,101 380,105 370,109" fill="#30363d"/>

  <rect x="380" y="74" width="140" height="62" rx="8" fill="#1a2744" stroke="#388bfd" stroke-width="1.5"/>
  <text x="450" y="96" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#a5d6ff" text-anchor="middle">OpenAPI JSON</text>
  <text x="450" y="112" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">/v3/api-docs</text>
  <text x="450" y="126" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">especificacion OAS 3.x</text>

  <line x1="520" y1="105" x2="550" y2="105" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="550,101 560,105 550,109" fill="#30363d"/>

  <rect x="560" y="74" width="220" height="62" rx="8" fill="#1a2a1a" stroke="#6DB33F" stroke-width="1.5"/>
  <text x="670" y="96" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#7ee787" text-anchor="middle">Swagger UI</text>
  <text x="670" y="112" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">/swagger-ui.html</text>
  <text x="670" y="126" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">interfaz interactiva</text>

  <text x="30" y="158" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#6DB33F">Anotaciones Clave</text>
  <rect x="30" y="168" width="360" height="178" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="42" y="178" width="336" height="156" rx="5" fill="#0d1117"/>
  <text x="54" y="198" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">@Tag</text>
  <text x="130" y="198" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">(name = </text>
  <text x="186" y="198" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a8ff78">"Employees"</text>
  <text x="262" y="198" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">,</text>
  <text x="54" y="214" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">     description = </text>
  <text x="166" y="214" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a8ff78">"CRUD operations"</text>
  <text x="292" y="214" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">)</text>
  <text x="54" y="230" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#8b949e">// Agrupa endpoints en Swagger UI bajo una seccion</text>
  <line x1="50" y1="236" x2="370" y2="236" stroke="#21262d" stroke-width="1"/>
  <text x="54" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">@Operation</text>
  <text x="130" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">(summary = </text>
  <text x="200" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a8ff78">"Create employee"</text>
  <text x="326" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">)</text>
  <text x="54" y="268" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#8b949e">// Titulo del endpoint en Swagger UI</text>
  <line x1="50" y1="274" x2="370" y2="274" stroke="#21262d" stroke-width="1"/>
  <text x="54" y="290" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">@ApiResponse</text>
  <text x="138" y="290" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">(responseCode = </text>
  <text x="258" y="290" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a8ff78">"201"</text>
  <text x="290" y="290" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">,</text>
  <text x="54" y="306" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">              description = </text>
  <text x="210" y="306" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a8ff78">"Created"</text>
  <text x="268" y="306" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">)</text>
  <text x="54" y="322" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#8b949e">// Documenta posibles codigos HTTP de respuesta</text>

  <text x="30" y="374" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#6DB33F">Resultado en Swagger UI</text>
  <rect x="30" y="384" width="360" height="62" rx="8" fill="#1a2a1a" stroke="#6DB33F" stroke-width="1.5"/>
  <text x="210" y="404" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#7ee787" text-anchor="middle">GET /api/employees      200 OK ✅</text>
  <text x="210" y="420" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#7ee787" text-anchor="middle">POST /api/employees     201 Created / 400 Bad Request</text>
  <text x="210" y="436" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#7ee787" text-anchor="middle">DELETE /api/employees/{id}  204 No Content / 404</text>

  <text x="410" y="158" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#6DB33F">Configuracion en application.yml</text>
  <rect x="410" y="168" width="370" height="100" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="422" y="178" width="346" height="82" rx="5" fill="#0d1117"/>
  <text x="434" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a5d6ff">springdoc:</text>
  <text x="434" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">  api-docs:</text>
  <text x="434" y="228" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">    path: </text>
  <text x="494" y="228" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a8ff78">/v3/api-docs</text>
  <text x="434" y="244" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">  swagger-ui:</text>
  <text x="434" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">    path: </text>
  <text x="480" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a8ff78">/swagger-ui.html</text>

  <text x="410" y="292" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#6DB33F">Configuracion del API Bean (optional)</text>
  <rect x="410" y="302" width="370" height="146" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="422" y="312" width="346" height="124" rx="5" fill="#0d1117"/>
  <text x="434" y="330" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">@Configuration</text>
  <text x="434" y="346" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#ff7b72">public class </text>
  <text x="510" y="346" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">OpenApiConfig </text>
  <text x="608" y="346" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">{</text>
  <text x="434" y="362" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">  @Bean</text>
  <text x="434" y="378" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a5d6ff">  OpenAPI </text>
  <text x="490" y="378" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">customOpenAPI() {</text>
  <text x="434" y="394" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#ff7b72">    return new </text>
  <text x="504" y="394" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a5d6ff">OpenAPI</text>
  <text x="548" y="394" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">().info(</text>
  <text x="434" y="410" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#ff7b72">      new </text>
  <text x="474" y="410" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a5d6ff">Info</text>
  <text x="498" y="410" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">().title(</text>
  <text x="556" y="410" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a8ff78">"Employee API"</text>
  <text x="660" y="410" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">));</text>
  <text x="434" y="426" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">  } }</text>
</svg>
