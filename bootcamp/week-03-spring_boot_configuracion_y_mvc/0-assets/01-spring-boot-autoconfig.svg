<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6DB33F"/>
    </marker>
  </defs>

  <rect width="800" height="460" fill="#0d1117"/>

  <text x="400" y="32" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Spring Boot: Auto-configuracion y @SpringBootApplication</text>

  <text x="30" y="62" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#6DB33F">Flujo de Auto-configuracion</text>

  <rect x="30" y="72" width="200" height="36" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="130" y="87" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#a5d6ff" text-anchor="middle">pom.xml</text>
  <text x="130" y="101" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">agrega spring-boot-starter-web</text>

  <line x1="230" y1="90" x2="258" y2="90" stroke="#6DB33F" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="260" y="72" width="200" height="36" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="360" y="87" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#e3b341" text-anchor="middle">Classpath</text>
  <text x="360" y="101" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Spring detecta DispatcherServlet</text>

  <line x1="460" y1="90" x2="488" y2="90" stroke="#6DB33F" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="490" y="72" width="280" height="36" rx="5" fill="#1a2a1a" stroke="#6DB33F" stroke-width="1.5"/>
  <text x="630" y="87" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#7ee787" text-anchor="middle">Auto-config activa</text>
  <text x="630" y="101" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Tomcat + Jackson + MVC listos</text>

  <text x="30" y="138" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#6DB33F">@SpringBootApplication = 3 anotaciones</text>

  <rect x="30" y="148" width="350" height="130" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="43" y="160" width="324" height="106" rx="5" fill="#0d1117"/>
  <text x="55" y="178" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">@SpringBootApplication</text>
  <text x="55" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8b949e">// equivale a las 3 de abajo:</text>
  <text x="55" y="214" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">@SpringBootConfiguration</text>
  <text x="245" y="214" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8b949e">  // = @Configuration</text>
  <text x="55" y="232" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">@EnableAutoConfiguration</text>
  <text x="245" y="232" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8b949e">  // activa auto-config</text>
  <text x="55" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">@ComponentScan</text>
  <text x="245" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8b949e">          // escanea beans</text>

  <text x="30" y="302" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#6DB33F">Starters mas usados</text>

  <rect x="30" y="312" width="350" height="120" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="45" y="334" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a5d6ff">spring-boot-starter-web</text>
  <text x="230" y="334" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6b7280">Tomcat + Jackson + MVC</text>
  <line x1="40" y1="342" x2="370" y2="342" stroke="#21262d" stroke-width="1"/>
  <text x="45" y="360" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a5d6ff">spring-boot-starter-data-jpa</text>
  <text x="248" y="360" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6b7280">JPA + Hibernate + HikariCP</text>
  <line x1="40" y1="368" x2="370" y2="368" stroke="#21262d" stroke-width="1"/>
  <text x="45" y="386" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a5d6ff">spring-boot-starter-security</text>
  <text x="248" y="386" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6b7280">Spring Security</text>
  <line x1="40" y1="394" x2="370" y2="394" stroke="#21262d" stroke-width="1"/>
  <text x="45" y="414" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a5d6ff">spring-boot-starter-test</text>
  <text x="230" y="414" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6b7280">JUnit 5 + Mockito + MockMvc</text>

  <text x="410" y="138" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#6DB33F">Actuator: endpoints de monitoreo</text>

  <rect x="410" y="148" width="360" height="284" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

  <text x="425" y="170" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" font-weight="600" fill="#8b949e">Endpoint</text>
  <text x="570" y="170" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" font-weight="600" fill="#8b949e">Descripcion</text>
  <line x1="420" y1="176" x2="762" y2="176" stroke="#21262d" stroke-width="1"/>

  <text x="425" y="194" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#7ee787">/actuator/health</text>
  <text x="570" y="194" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6b7280">Estado de la app (UP/DOWN)</text>
  <line x1="420" y1="202" x2="762" y2="202" stroke="#21262d" stroke-width="1"/>

  <text x="425" y="220" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#7ee787">/actuator/info</text>
  <text x="570" y="220" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6b7280">Info custom de la aplicacion</text>
  <line x1="420" y1="228" x2="762" y2="228" stroke="#21262d" stroke-width="1"/>

  <text x="425" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#7ee787">/actuator/metrics</text>
  <text x="570" y="246" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6b7280">JVM, HTTP, mem, threads</text>
  <line x1="420" y1="254" x2="762" y2="254" stroke="#21262d" stroke-width="1"/>

  <text x="425" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#7ee787">/actuator/env</text>
  <text x="570" y="272" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6b7280">Variables de entorno activas</text>
  <line x1="420" y1="280" x2="762" y2="280" stroke="#21262d" stroke-width="1"/>

  <text x="425" y="298" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#7ee787">/actuator/beans</text>
  <text x="570" y="298" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6b7280">Todos los beans registrados</text>
  <line x1="420" y1="306" x2="762" y2="306" stroke="#21262d" stroke-width="1"/>

  <text x="425" y="324" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#7ee787">/actuator/mappings</text>
  <text x="570" y="324" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6b7280">Todos los endpoints HTTP</text>

  <rect x="420" y="338" width="340" height="78" rx="5" fill="#0d1117"/>
  <text x="432" y="356" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600" fill="#8b949e">application.yml</text>
  <text x="432" y="374" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">management:</text>
  <text x="432" y="390" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">  endpoints.web.exposure.include:</text>
  <text x="432" y="406" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a8ff78">    - health,info,metrics</text>

  <text x="400" y="452" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Solo /actuator/health esta expuesto por defecto — habilitar los demas explicitamente</text>
</svg>
