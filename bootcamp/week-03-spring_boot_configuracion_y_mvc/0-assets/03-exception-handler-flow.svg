<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#ff7b72"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6DB33F"/>
    </marker>
  </defs>
  <rect width="800" height="460" fill="#0d1117"/>
  <text x="400" y="32" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Manejo Global de Excepciones con @RestControllerAdvice</text>
  <text x="30" y="62" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#6DB33F">Flujo de una excepcion</text>
  <rect x="30" y="72" width="100" height="36" rx="5" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
  <text x="80" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a5d6ff" text-anchor="middle">Request</text>
  <text x="80" y="100" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">GET /products/99</text>
  <line x1="130" y1="90" x2="158" y2="90" stroke="#388bfd" stroke-width="1.5" marker-end="url(#arrg)"/>
  <rect x="160" y="72" width="100" height="36" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="210" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341" text-anchor="middle">Controller</text>
  <text x="210" y="100" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">llama service</text>
  <line x1="260" y1="90" x2="288" y2="90" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrg)"/>
  <rect x="290" y="72" width="100" height="36" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="340" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341" text-anchor="middle">Service</text>
  <text x="340" y="100" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">throws exception</text>
  <line x1="390" y1="90" x2="418" y2="90" stroke="#ff7b72" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="420" y="72" width="150" height="36" rx="5" fill="#2d1a1a" stroke="#ff7b72" stroke-width="1.5"/>
  <text x="495" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#ff7b72" text-anchor="middle">ProductNotFoundException</text>
  <text x="495" y="100" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">extends RuntimeException</text>
  <line x1="570" y1="90" x2="598" y2="90" stroke="#ff7b72" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="600" y="72" width="170" height="36" rx="5" fill="#1a2a1a" stroke="#6DB33F" stroke-width="2"/>
  <text x="685" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#7ee787" text-anchor="middle">@RestControllerAdvice</text>
  <text x="685" y="100" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">captura y formatea error</text>
  <text x="30" y="132" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#6DB33F">Implementacion del handler global</text>
  <rect x="30" y="142" width="430" height="196" rx="8" fill="#161b22" stroke="#6DB33F" stroke-width="1.5"/>
  <rect x="42" y="152" width="406" height="174" rx="5" fill="#0d1117"/>
  <text x="54" y="170" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">@RestControllerAdvice</text>
  <text x="54" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#ff7b72">public class </text>
  <text x="126" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">GlobalExceptionHandler </text>
  <text x="248" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">{</text>
  <text x="54" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8b949e">  record ErrorResponse(</text>
  <text x="186" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a5d6ff">int </text>
  <text x="210" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">status, </text>
  <text x="256" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a5d6ff">String </text>
  <text x="292" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">error, message, path) {}</text>
  <text x="54" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">  @ExceptionHandler</text>
  <text x="172" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">(ProductNotFoundException.class)</text>
  <text x="54" y="238" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">  @ResponseStatus</text>
  <text x="156" y="238" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">(HttpStatus.NOT_FOUND)</text>
  <text x="54" y="254" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">  ErrorResponse handleNotFound(ProductNotFoundException ex,</text>
  <text x="54" y="270" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">                               HttpServletRequest req) {</text>
  <text x="54" y="286" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">    return </text>
  <text x="100" y="286" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#ff7b72">new </text>
  <text x="120" y="286" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">ErrorResponse</text>
  <text x="192" y="286" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">(404, "Not Found", ex.getMessage(), req.getRequestURI()); }}</text>
  <text x="30" y="360" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#6DB33F">Respuesta JSON estandarizada</text>
  <rect x="30" y="370" width="430" height="78" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="42" y="380" width="406" height="56" rx="5" fill="#0d1117"/>
  <text x="54" y="398" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">{</text>
  <text x="54" y="414" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">  "status"</text>
  <text x="110" y="414" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">: 404,  </text>
  <text x="156" y="414" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">"error"</text>
  <text x="206" y="414" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">: </text>
  <text x="218" y="414" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a8ff78">"Not Found"</text>
  <text x="54" y="430" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">  "message"</text>
  <text x="116" y="430" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">: </text>
  <text x="128" y="430" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a8ff78">"Product not found with id: 99"</text>
  <text x="338" y="430" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">  "path"</text>
  <text x="376" y="430" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">: </text>
  <text x="388" y="430" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a8ff78">"/api/products/99" }</text>
  <text x="480" y="132" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#6DB33F">Anotaciones clave</text>
  <rect x="480" y="142" width="290" height="196" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="492" y="152" width="266" height="52" rx="5" fill="#1a2a1a" stroke="#6DB33F" stroke-width="1"/>
  <text x="506" y="170" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#7ee787">@RestControllerAdvice</text>
  <text x="506" y="186" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#6b7280">= @ControllerAdvice + @ResponseBody</text>
  <text x="506" y="198" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#6b7280">Intercepta todas las excepciones</text>
  <rect x="492" y="212" width="266" height="52" rx="5" fill="#2d2000" stroke="#e3b341" stroke-width="1"/>
  <text x="506" y="230" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">@ExceptionHandler</text>
  <text x="506" y="246" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#6b7280">Vincula metodo con tipo</text>
  <text x="506" y="258" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#6b7280">de excepcion especifico</text>
  <rect x="492" y="272" width="266" height="52" rx="5" fill="#1a2744" stroke="#388bfd" stroke-width="1"/>
  <text x="506" y="290" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a5d6ff">@ResponseStatus</text>
  <text x="506" y="306" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#6b7280">Define el codigo HTTP de la</text>
  <text x="506" y="318" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#6b7280">respuesta (NOT_FOUND, CONFLICT...)</text>
  <text x="480" y="360" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#6DB33F">Excepciones a manejar</text>
  <rect x="480" y="370" width="290" height="78" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="496" y="390" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#ff7b72">XxxNotFoundException</text>
  <text x="640" y="390" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#6b7280"> -> 404</text>
  <text x="496" y="408" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#ff7b72">DuplicateXxxException</text>
  <text x="640" y="408" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#6b7280"> -> 409</text>
  <text x="496" y="426" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#ff7b72">MethodArgumentNotValid</text>
  <text x="640" y="426" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#6b7280"> -> 400</text>
  <text x="496" y="444" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#ff7b72">Exception (catch-all)</text>
  <text x="640" y="444" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#6b7280"> -> 500</text>
</svg>
