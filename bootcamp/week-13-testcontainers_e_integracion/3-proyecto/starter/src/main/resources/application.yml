spring:
  application:
    name: inventory-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/inventorydb}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

server:
  port: 8080
