<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <rect width="800" height="420" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="30" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Bean Lifecycle + Scopes</text>

  <!-- ═══ TOP SECTION: Lifecycle Timeline ═══ -->
  <text x="30" y="58" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#6DB33F">Ciclo de Vida del Bean</text>

  <!-- Timeline bar -->
  <rect x="30" y="68" width="740" height="58" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <!-- Step boxes on timeline -->
  <!-- Step 1: Instantiate -->
  <rect x="40" y="76" width="110" height="42" rx="5" fill="#1f2937" stroke="#388bfd" stroke-width="1.5"/>
  <text x="95" y="93" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#a5d6ff" text-anchor="middle" font-weight="600">1. Instanciar</text>
  <text x="95" y="108" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#8b949e" text-anchor="middle">new Bean()</text>

  <!-- Arrow -->
  <line x1="150" y1="97" x2="175" y2="97" stroke="#30363d" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- Step 2: Inject -->
  <rect x="178" y="76" width="120" height="42" rx="5" fill="#1f2937" stroke="#388bfd" stroke-width="1.5"/>
  <text x="238" y="93" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#a5d6ff" text-anchor="middle" font-weight="600">2. Inyectar Deps</text>
  <text x="238" y="108" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#8b949e" text-anchor="middle">constructor/field</text>

  <!-- Arrow -->
  <line x1="298" y1="97" x2="323" y2="97" stroke="#30363d" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- Step 3: @PostConstruct (highlighted green) -->
  <rect x="326" y="76" width="130" height="42" rx="5" fill="#1a3a1a" stroke="#6DB33F" stroke-width="2"/>
  <text x="391" y="93" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#7ee787" text-anchor="middle" font-weight="700">3. @PostConstruct</text>
  <text x="391" y="108" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#6DB33F" text-anchor="middle">inicialización</text>

  <!-- Arrow -->
  <line x1="456" y1="97" x2="481" y2="97" stroke="#30363d" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- Step 4: In use -->
  <rect x="484" y="76" width="100" height="42" rx="5" fill="#1f2937" stroke="#e3b341" stroke-width="1.5"/>
  <text x="534" y="93" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#e3b341" text-anchor="middle" font-weight="600">4. En uso</text>
  <text x="534" y="108" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#8b949e" text-anchor="middle">servicios activos</text>

  <!-- Arrow -->
  <line x1="584" y1="97" x2="609" y2="97" stroke="#30363d" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- Step 5: @PreDestroy (highlighted red) -->
  <rect x="612" y="76" width="130" height="42" rx="5" fill="#3a1a1a" stroke="#f85149" stroke-width="2"/>
  <text x="677" y="93" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#f85149" text-anchor="middle" font-weight="700">5. @PreDestroy</text>
  <text x="677" y="108" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#e05c5c" text-anchor="middle">limpieza</text>

  <defs>
    <marker id="arrow-gray" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#30363d"/>
    </marker>
  </defs>

  <!-- ═══ BOTTOM SECTION: Scopes ═══ -->
  <text x="30" y="158" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#6DB33F">Escopos de Bean</text>

  <!-- ── Singleton Panel ── -->
  <rect x="30" y="170" width="360" height="230" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
  <text x="210" y="192" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#a5d6ff" text-anchor="middle">Singleton (default)</text>
  <text x="210" y="210" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Una instancia por ApplicationContext</text>

  <!-- One bean in center -->
  <rect x="155" y="220" width="110" height="36" rx="5" fill="#1f6feb" stroke="#388bfd" stroke-width="1.5"/>
  <text x="210" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#e6edf3" text-anchor="middle">BookService</text>

  <!-- 3 requestors pointing to same bean -->
  <rect x="46" y="280" width="80" height="28" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="86" y="299" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8b949e" text-anchor="middle">Controller A</text>

  <rect x="164" y="280" width="80" height="28" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="204" y="299" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8b949e" text-anchor="middle">Controller B</text>

  <rect x="280" y="280" width="80" height="28" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="320" y="299" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8b949e" text-anchor="middle">Scheduler</text>

  <!-- Lines from requestors to bean -->
  <line x1="86" y1="280" x2="175" y2="256" stroke="#388bfd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="204" y1="280" x2="210" y2="256" stroke="#388bfd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="320" y1="280" x2="245" y2="256" stroke="#388bfd" stroke-width="1.5" stroke-dasharray="4,3"/>

  <text x="210" y="332" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#388bfd" text-anchor="middle">↑ misma instancia los 3</text>

  <!-- Code snippet singleton -->
  <rect x="46" y="348" width="330" height="36" rx="5" fill="#0d1117"/>
  <text x="58" y="366" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#7ee787">@Service</text>
  <text x="58" y="380" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#ff7b72">public class</text>
  <text x="140" y="380" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">BookService</text>
  <text x="224" y="380" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8b949e">{ } // singleton by default</text>

  <!-- ── Prototype Panel ── -->
  <rect x="410" y="170" width="360" height="230" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
  <text x="590" y="192" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#e3b341" text-anchor="middle">Prototype</text>
  <text x="590" y="210" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Nueva instancia por cada solicitud</text>

  <!-- 3 different bean instances -->
  <rect x="424" y="220" width="100" height="36" rx="5" fill="#2d2000" stroke="#e3b341" stroke-width="1.5"/>
  <text x="474" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341" text-anchor="middle">Report#a1b2</text>

  <rect x="540" y="220" width="100" height="36" rx="5" fill="#2d2000" stroke="#e3b341" stroke-width="1.5"/>
  <text x="590" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341" text-anchor="middle">Report#c3d4</text>

  <rect x="656" y="220" width="100" height="36" rx="5" fill="#2d2000" stroke="#e3b341" stroke-width="1.5"/>
  <text x="706" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341" text-anchor="middle">Report#e5f6</text>

  <!-- 3 requestors -->
  <rect x="424" y="280" width="80" height="28" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="464" y="299" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8b949e" text-anchor="middle">getBean()</text>

  <rect x="550" y="280" width="80" height="28" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="590" y="299" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8b949e" text-anchor="middle">getBean()</text>

  <rect x="676" y="280" width="80" height="28" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="716" y="299" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8b949e" text-anchor="middle">getBean()</text>

  <!-- Lines from requestors to separate beans -->
  <line x1="464" y1="280" x2="464" y2="256" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="590" y1="280" x2="590" y2="256" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="716" y1="280" x2="716" y2="256" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="4,3"/>

  <text x="590" y="332" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#e3b341" text-anchor="middle">↑ instancias distintas</text>

  <!-- Code snippet prototype -->
  <rect x="424" y="348" width="330" height="36" rx="5" fill="#0d1117"/>
  <text x="436" y="366" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#7ee787">@Component  @Scope("prototype")</text>
  <text x="436" y="380" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#ff7b72">public class</text>
  <text x="518" y="380" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">ReportBuilder</text>
  <text x="618" y="380" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">{ }</text>
</svg>
