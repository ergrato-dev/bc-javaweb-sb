<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="32" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">IoC Container vs Instanciación Manual</text>

  <!-- ── LEFT PANEL: Without IoC ── -->
  <rect x="20" y="50" width="355" height="330" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="197" y="74" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#f85149" text-anchor="middle">❌ Sin IoC — acoplado</text>

  <!-- Code block left -->
  <rect x="36" y="84" width="323" height="90" rx="6" fill="#0d1117"/>
  <text x="48" y="102" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#8b949e">// Tu código crea sus dependencias</text>
  <text x="48" y="120" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#ff7b72">public class</text>
  <text x="140" y="120" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#e3b341">OrderService</text>
  <text x="236" y="120" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#e6edf3">{</text>
  <text x="48" y="138" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#a5d6ff">  EmailService</text>
  <text x="152" y="138" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#e6edf3">email =</text>
  <text x="210" y="138" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#ff7b72">new</text>
  <text x="232" y="138" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#a5d6ff">EmailService</text>
  <text x="322" y="138" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#e6edf3">();</text>
  <text x="48" y="156" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#a5d6ff">  PayService</text>
  <text x="134" y="156" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#e6edf3">pay =</text>
  <text x="176" y="156" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#ff7b72">new</text>
  <text x="198" y="156" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#a5d6ff">PayService</text>
  <text x="278" y="156" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#e6edf3">();</text>
  <text x="48" y="168" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#e6edf3">}</text>

  <!-- Problem arrows -->
  <text x="197" y="204" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#f85149" text-anchor="middle" font-weight="600">Problemas:</text>
  <text x="197" y="224" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#8b949e" text-anchor="middle">• Difícil de testear (no se puede sustituir)</text>
  <text x="197" y="244" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#8b949e" text-anchor="middle">• Código acoplado a implementaciones concretas</text>
  <text x="197" y="264" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#8b949e" text-anchor="middle">• Cambiar implementación requiere modificar código</text>
  <text x="197" y="284" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#8b949e" text-anchor="middle">• Ciclo de vida manual y tedioso</text>

  <!-- ── RIGHT PANEL: With IoC ── -->
  <rect x="425" y="50" width="355" height="330" rx="8" fill="#161b22" stroke="#6DB33F" stroke-width="1.5"/>
  <text x="602" y="74" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#7ee787" text-anchor="middle">✅ Con IoC — Spring gestiona</text>

  <!-- Spring Container box inside right panel -->
  <rect x="441" y="84" width="323" height="120" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="602" y="103" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#6DB33F" text-anchor="middle" font-weight="600">Spring ApplicationContext</text>

  <!-- Beans inside container -->
  <rect x="455" y="112" width="90" height="28" rx="4" fill="#1f6feb" stroke="#388bfd" stroke-width="1"/>
  <text x="500" y="131" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#e6edf3" text-anchor="middle">@Service</text>

  <rect x="555" y="112" width="100" height="28" rx="4" fill="#1f6feb" stroke="#388bfd" stroke-width="1"/>
  <text x="605" y="131" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#e6edf3" text-anchor="middle">@Repository</text>

  <rect x="665" y="112" width="84" height="28" rx="4" fill="#1f6feb" stroke="#388bfd" stroke-width="1"/>
  <text x="707" y="131" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#e6edf3" text-anchor="middle">@Config</text>

  <!-- Wiring lines -->
  <line x1="500" y1="140" x2="500" y2="160" stroke="#6DB33F" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="605" y1="140" x2="605" y2="160" stroke="#6DB33F" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="707" y1="140" x2="707" y2="160" stroke="#6DB33F" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="500" y1="160" x2="707" y2="160" stroke="#6DB33F" stroke-width="1.5"/>
  <line x1="602" y1="160" x2="602" y2="177" stroke="#6DB33F" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <defs>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6DB33F"/>
    </marker>
  </defs>

  <text x="602" y="193" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#6DB33F" text-anchor="middle">injected</text>

  <!-- Code block right -->
  <rect x="441" y="218" width="323" height="68" rx="6" fill="#0d1117"/>
  <text x="453" y="236" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#7ee787">@Service</text>
  <text x="453" y="254" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#ff7b72">public class</text>
  <text x="547" y="254" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#e3b341">OrderService</text>
  <text x="641" y="254" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#e6edf3">{</text>
  <text x="453" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#ff7b72">  final</text>
  <text x="495" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#a5d6ff">EmailService</text>
  <text x="595" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#e6edf3">email;</text>
  <text x="453" y="279" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#8b949e">  // Spring inyecta automáticamente</text>

  <!-- Benefits list -->
  <text x="602" y="312" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#7ee787" text-anchor="middle" font-weight="600">Beneficios:</text>
  <text x="602" y="332" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#8b949e" text-anchor="middle">• Fácil de testear (inyectar mocks por constructor)</text>
  <text x="602" y="352" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#8b949e" text-anchor="middle">• Bajo acoplamiento — depende de interfaces</text>
  <text x="602" y="372" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#8b949e" text-anchor="middle">• Spring gestiona ciclo de vida automáticamente</text>

  <!-- VS divider -->
  <circle cx="400" cy="215" r="20" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="400" y="220" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="800" fill="#e6edf3" text-anchor="middle">VS</text>
</svg>
