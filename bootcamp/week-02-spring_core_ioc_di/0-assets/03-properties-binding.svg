<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#0d1117"/>

  <!-- Title -->
  <text x="400" y="30" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Configuración: @Value vs @ConfigurationProperties</text>

  <!-- ═══ LEFT: Properties hierarchy ═══ -->
  <text x="30" y="58" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#6DB33F">Jerarquía de Configuración (mayor prioridad abajo)</text>

  <!-- Boxes stacked like pyramid layers -->
  <!-- Layer 1 (lowest): application.yml -->
  <rect x="30" y="68" width="320" height="36" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="190" y="82" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#8b949e" text-anchor="middle">application.yml</text>
  <text x="190" y="97" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">valores base — siempre se carga</text>

  <!-- Arrow up -->
  <line x1="190" y1="104" x2="190" y2="116" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrow-up)"/>

  <!-- Layer 2: application-{profile}.yml -->
  <rect x="30" y="118" width="320" height="36" rx="5" fill="#1a2744" stroke="#388bfd" stroke-width="1.5"/>
  <text x="190" y="133" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#a5d6ff" text-anchor="middle">application-dev.yml / application-prod.yml</text>
  <text x="190" y="148" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">sobreescribe si el perfil está activo</text>

  <!-- Arrow up -->
  <line x1="190" y1="154" x2="190" y2="166" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrow-up)"/>

  <!-- Layer 3: System properties -->
  <rect x="30" y="168" width="320" height="36" rx="5" fill="#1a2a1a" stroke="#6DB33F" stroke-width="1.5"/>
  <text x="190" y="183" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#7ee787" text-anchor="middle">java -Dapp.name=prod-api -jar app.jar</text>
  <text x="190" y="198" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">system properties — mayor prioridad</text>

  <!-- Arrow up -->
  <line x1="190" y1="204" x2="190" y2="216" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrow-up)"/>

  <!-- Layer 4 (highest): Environment variables -->
  <rect x="30" y="218" width="320" height="36" rx="5" fill="#2d2000" stroke="#e3b341" stroke-width="2"/>
  <text x="190" y="233" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#e3b341" text-anchor="middle">APP_NAME=prod-api (env vars)</text>
  <text x="190" y="248" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">máxima prioridad — ideal para secretos</text>

  <defs>
    <marker id="arrow-up" markerWidth="7" markerHeight="7" refX="3.5" refY="0" orient="auto">
      <path d="M0,7 L3.5,0 L7,7 z" fill="#30363d"/>
    </marker>
  </defs>

  <!-- Note: env var mapping -->
  <rect x="30" y="268" width="320" height="60" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="190" y="285" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" fill="#8b949e" text-anchor="middle">Spring convierte env vars automáticamente:</text>
  <text x="190" y="303" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#e3b341" text-anchor="middle">DATABASE_URL</text>
  <text x="190" y="303" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#8b949e" x="305" text-anchor="start">  →</text>
  <text x="190" y="320" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#a5d6ff" text-anchor="middle">spring.datasource.url</text>

  <!-- ═══ RIGHT: @Value vs @ConfigurationProperties ═══ -->
  <!-- @Value (top right) -->
  <rect x="372" y="50" width="408" height="160" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="576" y="72" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#e3b341" text-anchor="middle">@Value — inyección individual</text>

  <rect x="385" y="80" width="382" height="118" rx="5" fill="#0d1117"/>
  <text x="397" y="97" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#7ee787">@Component</text>
  <text x="397" y="113" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#ff7b72">public class</text>
  <text x="473" y="113" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">AppInfo</text>
  <text x="517" y="113" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">{</text>
  <text x="397" y="131" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">  @Value</text>
  <text x="437" y="131" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">(</text>
  <text x="441" y="131" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a8ff78">"${app.name}"</text>
  <text x="531" y="131" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">)</text>
  <text x="397" y="147" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#ff7b72">  private</text>
  <text x="449" y="147" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a5d6ff">String</text>
  <text x="487" y="147" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">appName;</text>
  <text x="397" y="165" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8b949e">  // default: ${app.timeout:30}</text>
  <text x="397" y="192" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">}</text>

  <!-- @ConfigurationProperties (bottom right) -->
  <rect x="372" y="224" width="408" height="164" rx="8" fill="#161b22" stroke="#6DB33F" stroke-width="1.5"/>
  <text x="576" y="246" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#7ee787" text-anchor="middle">@ConfigurationProperties — tipado ✅</text>

  <rect x="385" y="255" width="382" height="122" rx="5" fill="#0d1117"/>
  <text x="397" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">@ConfigurationProperties</text>
  <text x="554" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">(prefix =</text>
  <text x="617" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a8ff78">"app"</text>
  <text x="645" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">)</text>
  <text x="397" y="288" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#ff7b72">public record</text>
  <text x="471" y="288" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e3b341">AppProperties</text>
  <text x="553" y="288" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">(</text>
  <text x="397" y="306" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a5d6ff">  String</text>
  <text x="437" y="306" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">name,</text>
  <text x="397" y="322" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a5d6ff">  int</text>
  <text x="421" y="322" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">maxBooksPerUser,</text>
  <text x="397" y="338" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#a5d6ff">  List&lt;String&gt;</text>
  <text x="479" y="338" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">allowedCategories) {}</text>
  <text x="397" y="356" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#8b949e">// Inmutable, tipado, validable con @Valid</text>
  <text x="397" y="370" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#e6edf3">)</text>

  <!-- Comparison labels -->
  <text x="576" y="395" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" fill="#8b949e" text-anchor="middle">✅ Validación con @Valid   ✅ Autocompletado IDE   ✅ Record inmutable</text>
</svg>
