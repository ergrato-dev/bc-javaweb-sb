spring:
  application:
    name: notifications-api

  datasource:
    url: jdbc:h2:mem:notificationsdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  h2:
    console:
      enabled: true
      path: /h2-console

  cache:
    cache-names: articles
    caffeine:
      spec: maximumSize=500,expireAfterWrite=5m

logging:
  level:
    com.bootcamp.notifications: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
